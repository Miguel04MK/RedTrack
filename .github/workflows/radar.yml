name: Radar diario

# ============================================================
#  Ejecuta la recoleccion y envia el resumen, sin servidor.
#
#  El trabajo dura ~31 segundos: pagar una maquina encendida las 24
#  horas para eso es la forma equivocada del problema.
# ============================================================

on:
  schedule:
    # 06:23 UTC = 08:23 en Madrid en horario de verano, 07:23 en invierno.
    # El cron de GitHub es siempre UTC y no ajusta el cambio de hora. Llegar
    # una hora antes en invierno es inofensivo; complicarlo con dos crons, no
    # merece la pena.
    #
    # El minuto 23 NO es capricho. Con '0 6' la primera ejecucion programada
    # arranco a las 10:51 UTC: casi cinco horas tarde. Todo el mundo programa
    # en la hora en punto, GitHub encola las ejecuciones y las de repositorios
    # privados en plan gratuito van al final. Fuera de la hora en punto hay
    # mucha menos cola.
    #
    # Aviso: aun asi no hay garantia de puntualidad, y GitHub DESACTIVA los
    # workflows programados en repositorios sin actividad durante 60 dias.
    - cron: '23 6 * * 1-5'

  # Para poder dispararlo a mano desde la pestana Actions.
  workflow_dispatch:

jobs:
  radar:
    name: Recolectar y avisar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar
        run: mvn -B -q package -DskipTests

      # El perfil del repositorio es un ejemplo publico. El real llega como
      # secreto para no publicar el salario objetivo: quien lo conoce antes
      # de negociar tiene ventaja.
      #
      # Si el secreto no existe, se sigue con el de ejemplo en vez de fallar:
      # el radar funcionaria peor, pero funcionaria.
      - name: Escribir el perfil real
        env:
          PERFIL_YAML: ${{ secrets.PERFIL_YAML }}
        run: |
          if [ -n "$PERFIL_YAML" ]; then
            printf '%s' "$PERFIL_YAML" > perfil.local.yaml
            echo "REDTRACK_PERFIL_RUTA=file:./perfil.local.yaml" >> "$GITHUB_ENV"
            echo "Usando el perfil del secreto PERFIL_YAML"
          else
            echo "::warning::No hay secreto PERFIL_YAML; se usa el perfil de ejemplo"
          fi

      - name: Ejecutar la pasada
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Madrid
        # El codigo de salida refleja si fue bien, asi que este paso se pone
        # en rojo cuando el radar falla. Sin eso, un fallo cuyo unico sintoma
        # es "no me llego un mensaje" seria invisible.
        run: java -jar target/redtrack-0.1.0-SNAPSHOT.jar --spring.profiles.active=una-pasada
