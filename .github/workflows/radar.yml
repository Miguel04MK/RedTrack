name: Radar diario

# ============================================================
#  Ejecuta la recoleccion y envia el resumen, sin servidor.
#
#  El trabajo dura ~31 segundos: pagar una maquina encendida las 24
#  horas para eso es la forma equivocada del problema.
# ============================================================

on:
  schedule:
    # 06:00 UTC = 08:00 en Madrid en horario de verano, 07:00 en invierno.
    # El cron de GitHub es siempre UTC y no ajusta el cambio de hora. Llegar
    # una hora antes en invierno es inofensivo; complicarlo con dos crons, no
    # merece la pena.
    #
    # Aviso: los workflows programados pueden retrasarse en horas punta, y
    # GitHub los DESACTIVA en repositorios sin actividad durante 60 dias.
    - cron: '0 6 * * 1-5'

  # Para poder dispararlo a mano desde la pestana Actions.
  workflow_dispatch:

jobs:
  radar:
    name: Recolectar y avisar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar
        run: mvn -B -q package -DskipTests

      - name: Ejecutar la pasada
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Madrid
        # El codigo de salida refleja si fue bien, asi que este paso se pone
        # en rojo cuando el radar falla. Sin eso, un fallo cuyo unico sintoma
        # es "no me llego un mensaje" seria invisible.
        run: java -jar target/redtrack-0.1.0-SNAPSHOT.jar --spring.profiles.active=una-pasada
