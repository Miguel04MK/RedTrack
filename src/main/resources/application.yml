spring:
  application:
    name: redtrack

  datasource:
    # 5433 es el puerto que publica docker-compose en el host: el 5432 suele
    # estar ocupado por un PostgreSQL instalado en el sistema. Dentro de Docker
    # esto lo sobreescribe SPRING_DATASOURCE_URL apuntando a postgres:5432.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/redtrack}
    username: ${POSTGRES_USER:redtrack}
    password: ${POSTGRES_PASSWORD:redtrack}

  jpa:
    # El esquema lo gobierna Flyway. Hibernate solo valida que coincide.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.miguelalvarez.redtrack: INFO

# ============================================================
#  RedTrack
#  Los secretos llegan por variable de entorno. Aqui solo van
#  los nombres y los valores por defecto no sensibles.
# ============================================================
redtrack:
  # Cada manana laborable a las 8:00, hora de Madrid.
  cron: "0 0 8 * * MON-FRI"

  # Protege POST /api/recolectar y POST /api/resumen, que gastan cuota de
  # Adzuna y hacen que el bot escriba. Si esta vacio, esos dos endpoints
  # devuelven 503 en vez de quedar abiertos.
  api:
    token: ${REDTRACK_API_TOKEN:}

  perfil:
    # El perfil del repositorio es un EJEMPLO. Para usar el tuyo sin
    # publicarlo, apunta aqui a un fichero que git ignore:
    #   REDTRACK_PERFIL_RUTA=file:./perfil.local.yaml
    ruta: ${REDTRACK_PERFIL_RUTA:classpath:perfil.yaml}

  busquedas:
    # Tu stack. Alimentan la seccion "para ti".
    terminos:
      - "java spring"
      - "desarrollador backend junior"
      - "java junior"

    # Puestos junior de desarrollo de cualquier stack, para la seccion
    # "podrian interesarte".
    #
    # Tienen que ser ESPECIFICOS: buscar "junior" a secas en Galicia devuelve
    # "Junior Territory Manager", "Comercial Tecnico Junior" y "Practicas RRHH".
    # Y no se puede filtrar con category=it-jobs, porque 13 de cada 17 ofertas
    # de informatica reales vienen con categoria "unknown".
    terminos-exploratorios:
      - "desarrollador junior"
      - "programador junior"
      - "junior developer"
      - "junior software"
      - "becario desarrollo"
      - "practicas programacion"

    ubicaciones:
      - "galicia"
      - "pontevedra"
      - "remoto"
    max-dias-antiguedad: 7
    max-resultados-por-fuente: 50

  adzuna:
    activa: true
    url: https://api.adzuna.com
    pais: es
    app-id: ${ADZUNA_APP_ID:}
    app-key: ${ADZUNA_APP_KEY:}

  remotive:
    # Verificada con curl: devuelve la descripcion COMPLETA (2.600-28.000
    # caracteres), que es justo lo que Adzuna trunca a 500.
    activa: true
    url: https://remotive.com
    categoria: software-dev
    dolares-por-euro: 1.08

  telegram:
    activo: true
    url: https://api.telegram.org
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}

  ia:
    activa: ${REDTRACK_IA_ACTIVA:false}
    url: ${OLLAMA_URL:http://localhost:11434}
    modelo: ${OLLAMA_MODELO:llama3.2}
    # Corto a proposito: con 30 ofertas, un timeout largo hace que la tarea
    # diaria no termine nunca.
    timeout: 5s
