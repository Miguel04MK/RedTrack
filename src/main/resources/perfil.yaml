# ============================================================
#  PERFIL DE EJEMPLO
#
#  Este fichero documenta el formato y sirve de valor por defecto para
#  que el proyecto arranque nada mas clonarlo. Los numeros de la seccion
#  "preferencias" son ilustrativos, no los de nadie.
#
#  Para usar el tuyo sin publicarlo, apunta a otro fichero con la
#  variable de entorno REDTRACK_PERFIL_RUTA:
#
#      REDTRACK_PERFIL_RUTA=file:./perfil.local.yaml
#
#  perfil.local.yaml esta en .gitignore. El salario objetivo es el dato
#  que conviene no publicar: quien lo conoce antes de negociar tiene
#  ventaja.
# ============================================================
#
#  Perfil contra el que se puntuan las ofertas.
#
#  Vive fuera del codigo para poder ajustarlo sin recompilar.
#
#  nivel: cuanto la dominas.  ALTO | MEDIO | BAJO | NINGUNO
#  peso:  cuanto IMPORTA que la oferta la pida (1 accesorio, 3 troncal).
#         Son dos ejes distintos: el peso NO es lo mucho que te gusta la
#         tecnologia. Una que no tienes pesa mucho precisamente porque
#         exigirla te deja fuera.
#
#  Por eso las de nivel NINGUNO llevan peso alto y no peso 0: el peso es el
#  denominador del bloque de tecnologias, y con peso 0 exigirlas salia gratis.
# ============================================================

tecnologias:
  - nombre: Java
    nivel: ALTO
    peso: 3
    alias: ["java 21", "java 17", "java 11", "java 8", "jdk"]

  - nombre: Spring Boot
    nivel: ALTO
    peso: 3
    alias: ["springboot", "spring-boot", "spring"]

  - nombre: PostgreSQL
    nivel: MEDIO
    peso: 2
    alias: ["postgres", "psql"]

  - nombre: SQL
    nivel: MEDIO
    peso: 2

  - nombre: JPA
    nivel: MEDIO
    peso: 2
    alias: ["hibernate", "spring data jpa"]

  - nombre: React
    nivel: MEDIO
    peso: 2
    alias: ["reactjs", "react.js"]

  - nombre: JavaScript
    nivel: MEDIO
    peso: 2
    alias: ["js", "ecmascript"]

  - nombre: Docker
    nivel: MEDIO
    peso: 2

  - nombre: Git
    nivel: ALTO
    peso: 1

  - nombre: AWS
    nivel: BAJO
    peso: 2
    alias: ["amazon web services", "ec2"]

  - nombre: Python
    nivel: BAJO
    peso: 1

  # --- Las que NO se tienen ---
  # Peso alto a proposito: si una oferta pide Angular o .NET como stack
  # principal, es una oferta que no te sirve, y la nota tiene que reflejarlo.
  - nombre: Angular
    nivel: NINGUNO
    peso: 3
  - nombre: .NET
    nivel: NINGUNO
    peso: 3
    alias: ["dotnet", "c#", "asp.net"]
  - nombre: PHP
    nivel: NINGUNO
    peso: 3
    alias: ["laravel", "symfony"]
  - nombre: Kafka
    nivel: NINGUNO
    peso: 2
  - nombre: Kubernetes
    nivel: NINGUNO
    peso: 2
    alias: ["k8s"]

# ============================================================
#  QUE SE BUSCA
#  Esto tambien es parte de tu perfil, no configuracion tecnica.
# ============================================================

busquedas:
  # Tu stack. Alimentan la seccion "para ti" del resumen.
  terminos:
    - "java spring"
    - "desarrollador backend junior"
    - "java junior"

  # Puestos junior de desarrollo de CUALQUIER stack, para la seccion
  # "podrian interesarte".
  #
  # Tienen que ser ESPECIFICOS: buscar "junior" a secas devuelve
  # comerciales, tecnicos de mantenimiento y practicas de administracion.
  terminos_exploratorios:
    - "desarrollador junior"
    - "programador junior"
    - "junior developer"
    - "junior software"
    - "becario desarrollo"
    - "practicas programacion"

  ubicaciones:
    - "galicia"
    - "pontevedra"
    - "remoto"

  max_dias_antiguedad: 7
  max_resultados_por_fuente: 50


preferencias:
  ubicaciones_deseadas:
    - galicia
    - pontevedra
    - vigo
    - a coruna
    - santiago
    - remoto
  # Bruto anual en euros. Valor de ejemplo.
  salario_objetivo: 30000
  # Nivel de ingles maximo que se acepta sin que salte bandera roja.
  idioma_maximo: B2
  descartar_si_titulo_contiene:
    - senior
    - lead
    - arquitecto
    - manager
  anos_maximos_aceptables: 3
  # Solo entran en el resumen diario las ofertas con encaje >= a esto.
  umbral_encaje: 55
